name: Build HisaabKit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract HisaabKit fixed project
        shell: bash
        run: |
          set -e

          ZIP="HisaabKit-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "HisaabKit-fixed.zip not found."
            exit 1
          fi

          rm -rf /tmp/hisaabkit-fixed
          mkdir -p /tmp/hisaabkit-fixed

          unzip -q "$ZIP" -d /tmp/hisaabkit-fixed

          if [ ! -d "/tmp/hisaabkit-fixed/Hisaabkit-main" ]; then
            echo "Hisaabkit-main folder not found inside ZIP."
            exit 1
          fi

          echo "ZIP extracted successfully."

      - name: Replace old project with fixed project
        shell: bash
        run: |
          set -e

          SRC="/tmp/hisaabkit-fixed/Hisaabkit-main"

          rsync -a --delete \
            --exclude='.git/' \
            "$SRC/" "./"

          rm -f HisaabKit-fixed.zip

          echo "Old project replaced successfully."

      - name: Show project structure
        shell: bash
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort | head -200

      - name: Commit updated project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply HisaabKit fixed project"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HisaabKit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

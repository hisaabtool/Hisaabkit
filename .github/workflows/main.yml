name: Build HisaabKit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed HisaabKit project
        shell: bash
        run: |
          set -e

          if [ ! -f "HisaabKit-fixed.zip" ]; then
            echo "ERROR: HisaabKit-fixed.zip not found"
            exit 1
          fi

          rm -rf /tmp/hisaabkit-fixed
          mkdir -p /tmp/hisaabkit-fixed

          unzip -q "HisaabKit-fixed.zip" -d /tmp/hisaabkit-fixed

          if [ ! -d "/tmp/hisaabkit-fixed/Hisaabkit-main" ]; then
            echo "ERROR: Hisaabkit-main folder not found"
            exit 1
          fi

          echo "Fixed project extracted successfully."

      - name: Replace old project files
        shell: bash
        run: |
          set -e

          rsync -a --delete \
            --exclude='.git/' \
            "/tmp/hisaabkit-fixed/Hisaabkit-main/" "./"

          echo "Fixed HisaabKit project is ready."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HisaabKit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
